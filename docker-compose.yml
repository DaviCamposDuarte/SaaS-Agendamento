services:
  mysql:
    image: mysql:8.0
    container_name: barbershop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: barbershop
      MYSQL_USER: barber
      MYSQL_PASSWORD: barber
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
